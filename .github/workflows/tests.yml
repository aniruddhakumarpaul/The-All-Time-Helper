name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      HELPER_DISABLE_TELEMETRY: "true"
      CHROMA_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -B -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/tah-pytest"