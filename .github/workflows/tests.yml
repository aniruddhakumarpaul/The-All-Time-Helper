name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      HELPER_DISABLE_TELEMETRY: "true"
      CHROMA_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt pytest
      - name: Check active frontend syntax
        shell: bash
        run: find static/js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install browser test runtime
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser workflows
        run: python -B -m pytest app/tests/test_browser_email_workflow.py -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/tah-browser"
      - name: Run Python tests
        run: python -B -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/tah-pytest"
